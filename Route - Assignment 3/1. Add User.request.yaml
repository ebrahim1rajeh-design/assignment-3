$kind: http-request
description: Adds a new user to users.json. Returns error if email already exists.
url: "{{baseUrl}}/user"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "User 1",
      "age": 27,
      "email": "newuser@email.com"
    }
order: 1000
